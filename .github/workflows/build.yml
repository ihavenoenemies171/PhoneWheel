name: Build PhoneWheel

# Runs on every push to main (and by hand from the Actions tab).
# Produces:  PhoneWheel.apk (Android app)  +  PhoneWheel-PC.zip (Windows .exe)
# and publishes both on the repo's Releases page.
on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build APK
        working-directory: android
        run: gradle assembleRelease --no-daemon --stacktrace
      - name: Rename APK
        run: cp android/app/build/outputs/apk/release/app-release.apk PhoneWheel.apk
      - uses: actions/upload-artifact@v4
        with:
          name: PhoneWheel-android
          path: PhoneWheel.apk

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r pc/requirements.txt pyinstaller
      - name: Build PhoneWheel.exe
        working-directory: pc
        run: pyinstaller --noconfirm --onefile --console --name PhoneWheel --icon icon.ico --add-data "web;web" server.py
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item pc/dist/PhoneWheel.exe out/
          Copy-Item pc/usb_android.bat out/
          Copy-Item pc/network_setup.bat out/
          Copy-Item README.md out/README.md
          Copy-Item LICENSE out/LICENSE.txt
          Copy-Item -Recurse docs out/docs
          Compress-Archive -Path out/* -DestinationPath PhoneWheel-PC.zip -Force
      - uses: actions/upload-artifact@v4
        with:
          name: PhoneWheel-PC
          path: PhoneWheel-PC.zip

  release:
    needs: [android, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: PhoneWheel v1.0.${{ github.run_number }}
          body: |
            **Phone:** download `PhoneWheel.apk` on your Android phone and install it.
            **PC:** download `PhoneWheel-PC.zip`, unzip, run `PhoneWheel.exe` (vJoy 2.2.2.0 must be installed).
          files: |
            PhoneWheel.apk
            PhoneWheel-PC.zip
